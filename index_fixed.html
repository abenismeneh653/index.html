<script>
const c=document.getElementById('c'),g=c.getContext('2d'),$=id=>document.getElementById(id);
const W=200,H=180,GR=[0,3.2,2.1,1.5,1.15,.9],S=3,DIST=402;

function start(){res='';me=mk(CARS[sv.cur].P*(1+.1*sv.eng+.08*sv.turbo),PAINT[sv.pc]);me.b=CARS[sv.cur].body;ai=mk(Math.min(3,.88+.07*sv.races)+Math.random()*.03,'#2a8be8');ai.b=Math.random()*5|0;newCars();
